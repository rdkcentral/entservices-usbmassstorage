name: Morning L1/L2 Status Report

on:
  workflow_dispatch:   # manual trigger for testing anytime
  push:
    branches:
      - feature/AI_POC_workflow_monitoring  # remove this line after merging to main
  pull_request:
    types: [closed]    # fires when any PR is closed; step below filters merged-only
    branches:
      - develop        # only PRs targeting develop branch (default branch)
  schedule:
    - cron: '*/10 * * * *'   # every 10 min for testing → change to '0 8 * * *' for daily 8AM

jobs:
  l1-l2-status:
    runs-on: ubuntu-latest
    permissions:
      actions: read    # read other workflow run results

    steps:
      # ── Step 0: Skip if PR was closed WITHOUT merging ──────────
      - name: Check if PR was actually merged
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "PR was closed but NOT merged — skipping report."
            exit 0
          fi
          echo "PR #${{ github.event.pull_request.number }} merged → running status check."

      # ── Step 1: Get latest main-workflow (tests-trigger) run ───
      # L1/L2 are workflow_call children — they don't have their own runs.
      # We fetch the latest run of tests-trigger.yml, then read its jobs.
      - name: Get latest tests-trigger run ID
        id: trigger_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # branch=develop → picks latest run regardless of trigger type (push/PR/dispatch)
          API="repos/${{ github.repository }}/actions/workflows/tests-trigger.yml/runs?per_page=1&branch=develop"
          RUN_ID=$(gh api "$API"   --jq '.workflow_runs[0].id')
          RUN_URL=$(gh api "$API"  --jq '.workflow_runs[0].html_url')
          RUN_DATE=$(gh api "$API" --jq '.workflow_runs[0].created_at')
          COMMIT=$(gh api "$API"   --jq '.workflow_runs[0].head_commit.message')
          echo "run_id=$RUN_ID"     >> $GITHUB_OUTPUT
          echo "run_url=$RUN_URL"   >> $GITHUB_OUTPUT
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "Source run ID : $RUN_ID"
          echo "Source commit : $COMMIT"
          echo "Source date   : $RUN_DATE"

      # ── Debug: confirm what run we are reading ──────────────
      - name: Debug run details
        run: |
          echo "RUN_ID   = ${{ steps.trigger_run.outputs.run_id }}"
          echo "RUN_DATE = ${{ steps.trigger_run.outputs.run_date }}"
          echo "RUN_URL  = ${{ steps.trigger_run.outputs.run_url }}"

      # ── Step 2: Read ALL job/step details from that run ────────
      - name: Get L1 and L2 job results
        id: jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.trigger_run.outputs.run_id }}"

          # Get full job list with each step's status inside
          ALL_JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100")

          L1=$(echo "$ALL_JOBS" | jq -r '.jobs[] | select(.name | test("L1|unit test"; "i")) | .conclusion' | head -1)
          L2=$(echo "$ALL_JOBS" | jq -r '.jobs[] | select(.name | test("L2"; "i")) | .conclusion' | head -1)

          # fallback: if job filter found nothing, use overall run conclusion
          if [[ -z "$L1" || "$L1" == "null" ]]; then
            L1=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.conclusion')
            echo "L1 job not matched by name — using overall run conclusion"
          fi
          [[ -z "$L2" ]] && L2=$L1

          echo "l1_conclusion=$L1" >> $GITHUB_OUTPUT
          echo "l2_conclusion=$L2" >> $GITHUB_OUTPUT
          echo "L1 → $L1"
          echo "L2 → $L2"

          # ── Collect failed stages for each job ─────────────────
          # For every failed job, list which STEPS inside it failed
          FAILED_DETAIL=$(echo "$ALL_JOBS" | jq -r '
            .jobs[] |
            select(.conclusion == "failure") |
            "JOB: \(.name)\n" +
            (
              .steps[] |
              select(.conclusion == "failure") |
              "  STEP \(.number): \(.name) → \(.conclusion)"
            )
          ')

          if [[ -z "$FAILED_DETAIL" ]]; then
            FAILED_DETAIL="No individual step failures found."
          fi

          # Save for email (multiline needs special encoding)
          {
            echo "failed_detail<<DELIM"
            echo "$FAILED_DETAIL"
            echo "DELIM"
          } >> $GITHUB_OUTPUT

          echo "--- Failed stages ---"
          echo "$FAILED_DETAIL"

      # ── Step 3: Print combined summary ─────────────────────────
      - name: Print status summary
        run: |
          echo "========================================"
          echo "  DAILY L1/L2 TEST STATUS REPORT"
          echo "  $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "========================================"
          echo ""
          echo "L1-tests  →  ${{ steps.jobs.outputs.l1_conclusion }}"
          echo "L2-tests  →  ${{ steps.jobs.outputs.l2_conclusion }}"
          echo "Run date  :  ${{ steps.trigger_run.outputs.run_date }}"
          echo "Run URL   :  ${{ steps.trigger_run.outputs.run_url }}"
          echo ""
          echo "--- Failed stage details ---"
          echo "${{ steps.jobs.outputs.failed_detail }}"
          echo ""

          if [[ "${{ steps.jobs.outputs.l1_conclusion }}" == "failure" || \
                "${{ steps.jobs.outputs.l2_conclusion }}" == "failure" ]]; then
            echo "❌ One or more test suites FAILED"
          else
            echo "✅ All test suites passed"
          fi

      # ── Step 4: GitHub Step Summary (no secrets, no issue creation) ──
      # Writes a formatted report into the Actions run page itself.
      # How to see it: Actions tab → click this run → click "Summary" at the top
      - name: Write job summary
        run: |
          if [[ "${{ steps.jobs.outputs.l1_conclusion }}" == "failure" || \
                "${{ steps.jobs.outputs.l2_conclusion }}" == "failure" ]]; then
            STATUS="❌ FAILED"
          else
            STATUS="✅ PASSED"
          fi

          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## L1/L2 Test Status Report
          SUMMARY

          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          **Overall:** $STATUS
          **Run date:** ${{ steps.trigger_run.outputs.run_date }}

          | Workflow | Result |
          |----------|--------|
          | L1-tests | ${{ steps.jobs.outputs.l1_conclusion }} |
          | L2-tests | ${{ steps.jobs.outputs.l2_conclusion }} |

          ### Failed Stage Details
          \`\`\`
          ${{ steps.jobs.outputs.failed_detail }}
          \`\`\`

          [View Full Run →](${{ steps.trigger_run.outputs.run_url }})
          SUMMARY
