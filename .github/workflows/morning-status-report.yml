name: Debug L1-L2 Discovery

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:

      - name: Workflow Context
        run: |
          echo "Repository = ${{ github.repository }}"
          echo "Branch     = ${{ github.ref_name }}"
          echo "Event      = ${{ github.event_name }}"
          echo "Run ID     = ${{ github.run_id }}"
          date -u

      - name: List All Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== AVAILABLE WORKFLOWS ====="

          gh api \
            repos/${{ github.repository }}/actions/workflows \
            --jq '.workflows[] | "NAME=\(.name) | ID=\(.id) | PATH=\(.path) | STATE=\(.state)"'

      - name: Raw Workflow JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== FULL WORKFLOW RESPONSE ====="

          gh api \
            repos/${{ github.repository }}/actions/workflows

      - name: Search For L1 And L2 Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== L1/L2 MATCHES ====="

          gh api \
            repos/${{ github.repository }}/actions/workflows \
            --jq '.workflows[] | select(.name|test("L1|L2";"i")) | "NAME=\(.name) | ID=\(.id) | PATH=\(.path)"'

      - name: Show Recent Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== RECENT RUNS ====="

          gh api \
            repos/${{ github.repository }}/actions/runs?per_page=20 \
            --jq '.workflow_runs[] | "\(.name) | \(.status) | \(.conclusion) | \(.head_branch)"'