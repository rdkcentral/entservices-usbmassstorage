name: Morning L1/L2 Status Report

on:
  workflow_dispatch:   # manual trigger for testing anytime
  push:
    branches:
      - feature/AI_POC_workflow_monitoring  # remove this line after merging to main
  pull_request:
    types: [closed]    # fires when any PR is closed; step below filters merged-only
    branches:
      - develop        # only PRs targeting develop branch (default branch)
  schedule:
    - cron: '*/10 * * * *'   # every 10 min for testing → change to '0 8 * * *' for daily 8AM

jobs:
  l1-l2-status:
    runs-on: ubuntu-latest
    permissions:
      actions: read

    env:
      # ╔══════════════════════════════════════════════════════╗
      # ║  ADD / REMOVE REPOS HERE — one per line              ║
      # ║  Format: owner/repo-name                             ║
      # ╚══════════════════════════════════════════════════════╝
      REPOS: |
        rdkcentral/entservices-usbmassstorage
        rdkcentral/entservices-usbdevice

    steps:
      # ── Step 0: Skip if PR was closed WITHOUT merging ──────────
      - name: Check if PR was actually merged
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "PR was closed but NOT merged — skipping report."
            exit 0
          fi
          echo "PR #${{ github.event.pull_request.number }} merged → proceeding."

      # ── Step 1: Loop through all repos, collect results ────────
      - name: Collect L1/L2 results from all repos
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OVERALL_STATUS="success"
          SUMMARY_TABLE=""
          FAILED_SECTIONS=""

          while IFS= read -r REPO; do
            # skip blank lines
            [[ -z "$REPO" ]] && continue

            echo "──────────────────────────────────────"
            echo "Processing: $REPO"

            API="repos/$REPO/actions/workflows/tests-trigger.yml/runs?per_page=1&branch=develop"

            RUN_ID=$(gh api "$API"   --jq '.workflow_runs[0].id'                2>/dev/null)
            RUN_URL=$(gh api "$API"  --jq '.workflow_runs[0].html_url'           2>/dev/null)
            RUN_DATE=$(gh api "$API" --jq '.workflow_runs[0].created_at'         2>/dev/null)
            COMMIT=$(gh api "$API"   --jq '.workflow_runs[0].head_commit.message' 2>/dev/null | head -1)

            if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
              echo "  ⚠️  No runs found for $REPO — skipping"
              SUMMARY_TABLE+="| $REPO | ⚠️ no data | ⚠️ no data | N/A |\n"
              continue
            fi

            echo "  Run ID : $RUN_ID"
            echo "  Commit : $COMMIT"
            echo "  Date   : $RUN_DATE"

            ALL_JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" 2>/dev/null)

            L1=$(echo "$ALL_JOBS" | jq -r '.jobs[] | select(.name | test("L1|unit test";"i")) | .conclusion' | head -1)
            L2=$(echo "$ALL_JOBS" | jq -r '.jobs[] | select(.name | test("L2";"i")) | .conclusion' | head -1)

            # fallback to overall run conclusion if job names not matched
            if [[ -z "$L1" || "$L1" == "null" ]]; then
              L1=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion' 2>/dev/null)
            fi
            [[ -z "$L2" || "$L2" == "null" ]] && L2=$L1

            echo "  L1=$L1  L2=$L2"

            # Mark overall as failed if any repo fails
            [[ "$L1" == "failure" || "$L2" == "failure" ]] && OVERALL_STATUS="failure"

            # Build summary table row
            L1_ICON=$([[ "$L1" == "success" ]] && echo "✅" || echo "❌")
            L2_ICON=$([[ "$L2" == "success" ]] && echo "✅" || echo "❌")
            SUMMARY_TABLE+="| [$REPO]($RUN_URL) | $L1_ICON $L1 | $L2_ICON $L2 | $RUN_DATE |\n"

            # Collect failed step details for this repo
            FAILED=$(echo "$ALL_JOBS" | jq -r '
              .jobs[] | select(.conclusion=="failure") |
              "JOB: \(.name)\n" +
              (.steps[] | select(.conclusion=="failure") |
              "  STEP \(.number): \(.name) → \(.conclusion)")' 2>/dev/null)

            if [[ -n "$FAILED" ]]; then
              FAILED_SECTIONS+="#### $REPO\n\`\`\`\n$FAILED\n\`\`\`\n"
            fi

          done <<< "$REPOS"

          # Save outputs for next step
          echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
          {
            echo "summary_table<<EOF"
            printf "$SUMMARY_TABLE"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "failed_sections<<EOF"
            printf "$FAILED_SECTIONS"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## L1/L2 Test Status Report — $(date -u +'%Y-%m-%d %H:%M UTC')

          ### entservices-usbmassstorage
          | Test | Result |
          |------|--------|
          | L1   | ${{ steps.repo1.outputs.l1 }} |
          | L2   | ${{ steps.repo1.outputs.l2 }} |

          **Failed stages:**
          \`\`\`
          ${{ steps.repo1.outputs.failed }}
          \`\`\`
          [View Run →](${{ steps.repo1.outputs.run_url }})

          ---

          ### entservices-usbdevice
          | Test | Result |
          |------|--------|
          | L1   | ${{ steps.repo2.outputs.l1 }} |
          | L2   | ${{ steps.repo2.outputs.l2 }} |

          **Failed stages:**
          \`\`\`
          ${{ steps.repo2.outputs.failed }}
          \`\`\`
          [View Run →](${{ steps.repo2.outputs.run_url }})
          SUMMARY
