name: Morning L1/L2 Status Report

on:
  workflow_dispatch:   # manual trigger for testing anytime
  push:
    branches:
      - feature/AI_POC_workflow_monitoring  # remove this line after merging to main
  pull_request:
    types: [closed]    # fires when any PR is closed; step below filters merged-only
    branches:
      - develop        # only PRs targeting develop branch (default branch)
  schedule:
    - cron: '*/10 * * * *'   # every 10 min for testing → change to '0 8 * * *' for daily 8AM

jobs:
  l1-l2-status:
    runs-on: ubuntu-latest
    permissions:
      actions: read    # read other workflow run results

    env:
      REPO_1: rdkcentral/entservices-usbmassstorage   # current repo
      REPO_2: rdkcentral/entservices-usbdevice         # second repo to monitor

    steps:
      # ── Step 0: Skip if PR was closed WITHOUT merging ──────────
      - name: Check if PR was actually merged
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "PR was closed but NOT merged — skipping report."
            exit 0
          fi
          echo "PR #${{ github.event.pull_request.number }} merged → running status check."

      # ── Helper function used by both repos ─────────────────────
      # Fetches L1/L2 results + failed stages for a given repo
      # Called twice below — once per repo
      - name: Fetch results for REPO_1 (usbmassstorage)
        id: repo1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ env.REPO_1 }}"
          API="repos/$REPO/actions/workflows/tests-trigger.yml/runs?per_page=1&branch=develop"

          RUN_ID=$(gh api "$API"   --jq '.workflow_runs[0].id')
          RUN_URL=$(gh api "$API"  --jq '.workflow_runs[0].html_url')
          RUN_DATE=$(gh api "$API" --jq '.workflow_runs[0].created_at')
          COMMIT=$(gh api "$API"   --jq '.workflow_runs[0].head_commit.message')

          echo "run_id=$RUN_ID"     >> $GITHUB_OUTPUT
          echo "run_url=$RUN_URL"   >> $GITHUB_OUTPUT
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "[$REPO] run_id=$RUN_ID  commit=$COMMIT"

          ALL_JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")

          L1=$(echo "$ALL_JOBS" | jq -r '.jobs[] | select(.name | test("L1|unit test";"i")) | .conclusion' | head -1)
          L2=$(echo "$ALL_JOBS" | jq -r '.jobs[] | select(.name | test("L2";"i")) | .conclusion' | head -1)

          if [[ -z "$L1" || "$L1" == "null" ]]; then
            L1=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion')
          fi
          [[ -z "$L2" || "$L2" == "null" ]] && L2=$L1

          FAILED=$(echo "$ALL_JOBS" | jq -r '
            .jobs[] | select(.conclusion=="failure") |
            "JOB: \(.name)\n" +
            (.steps[] | select(.conclusion=="failure") |
            "  STEP \(.number): \(.name) → \(.conclusion)")')
          [[ -z "$FAILED" ]] && FAILED="All steps passed."

          echo "l1=$L1" >> $GITHUB_OUTPUT
          echo "l2=$L2" >> $GITHUB_OUTPUT
          { echo "failed<<EOF"; echo "$FAILED"; echo "EOF"; } >> $GITHUB_OUTPUT
          echo "L1=$L1  L2=$L2"

      - name: Fetch results for REPO_2 (usbdevice)
        id: repo2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ env.REPO_2 }}"
          API="repos/$REPO/actions/workflows/tests-trigger.yml/runs?per_page=1&branch=develop"

          RUN_ID=$(gh api "$API"   --jq '.workflow_runs[0].id')
          RUN_URL=$(gh api "$API"  --jq '.workflow_runs[0].html_url')
          RUN_DATE=$(gh api "$API" --jq '.workflow_runs[0].created_at')
          COMMIT=$(gh api "$API"   --jq '.workflow_runs[0].head_commit.message')

          echo "run_id=$RUN_ID"     >> $GITHUB_OUTPUT
          echo "run_url=$RUN_URL"   >> $GITHUB_OUTPUT
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "[$REPO] run_id=$RUN_ID  commit=$COMMIT"

          ALL_JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")

          L1=$(echo "$ALL_JOBS" | jq -r '.jobs[] | select(.name | test("L1|unit test";"i")) | .conclusion' | head -1)
          L2=$(echo "$ALL_JOBS" | jq -r '.jobs[] | select(.name | test("L2";"i")) | .conclusion' | head -1)

          if [[ -z "$L1" || "$L1" == "null" ]]; then
            L1=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion')
          fi
          [[ -z "$L2" || "$L2" == "null" ]] && L2=$L1

          FAILED=$(echo "$ALL_JOBS" | jq -r '
            .jobs[] | select(.conclusion=="failure") |
            "JOB: \(.name)\n" +
            (.steps[] | select(.conclusion=="failure") |
            "  STEP \(.number): \(.name) → \(.conclusion)")')
          [[ -z "$FAILED" ]] && FAILED="All steps passed."

          echo "l1=$L1" >> $GITHUB_OUTPUT
          echo "l2=$L2" >> $GITHUB_OUTPUT
          { echo "failed<<EOF"; echo "$FAILED"; echo "EOF"; } >> $GITHUB_OUTPUT
          echo "L1=$L1  L2=$L2"

      # ── Step 3: Print combined summary (both repos) ────────────
      - name: Print status summary
        run: |
          echo "========================================"
          echo "  DAILY L1/L2 TEST STATUS REPORT"
          echo "  $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "========================================"
          echo ""
          echo "── entservices-usbmassstorage ──"
          echo "  L1 → ${{ steps.repo1.outputs.l1 }}"
          echo "  L2 → ${{ steps.repo1.outputs.l2 }}"
          echo "  Run: ${{ steps.repo1.outputs.run_url }}"
          echo ""
          echo "── entservices-usbdevice ──"
          echo "  L1 → ${{ steps.repo2.outputs.l1 }}"
          echo "  L2 → ${{ steps.repo2.outputs.l2 }}"
          echo "  Run: ${{ steps.repo2.outputs.run_url }}"
          echo ""

          if [[ "${{ steps.repo1.outputs.l1 }}" == "failure" || \
                "${{ steps.repo1.outputs.l2 }}" == "failure" || \
                "${{ steps.repo2.outputs.l1 }}" == "failure" || \
                "${{ steps.repo2.outputs.l2 }}" == "failure" ]]; then
            echo "❌ One or more test suites FAILED"
          else
            echo "✅ All test suites passed across both repos"
          fi

      # ── Step 4: GitHub Step Summary (both repos, no secrets) ───
      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## L1/L2 Test Status Report — $(date -u +'%Y-%m-%d %H:%M UTC')

          ### entservices-usbmassstorage
          | Test | Result |
          |------|--------|
          | L1   | ${{ steps.repo1.outputs.l1 }} |
          | L2   | ${{ steps.repo1.outputs.l2 }} |

          **Failed stages:**
          \`\`\`
          ${{ steps.repo1.outputs.failed }}
          \`\`\`
          [View Run →](${{ steps.repo1.outputs.run_url }})

          ---

          ### entservices-usbdevice
          | Test | Result |
          |------|--------|
          | L1   | ${{ steps.repo2.outputs.l1 }} |
          | L2   | ${{ steps.repo2.outputs.l2 }} |

          **Failed stages:**
          \`\`\`
          ${{ steps.repo2.outputs.failed }}
          \`\`\`
          [View Run →](${{ steps.repo2.outputs.run_url }})
          SUMMARY
